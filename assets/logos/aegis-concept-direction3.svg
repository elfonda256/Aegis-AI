<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="d3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="d3Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#050B18" rx="16"/>
  <!-- Minimalist Chevron Sentinel -->
  <g transform="translate(140, 25)">
    <!-- Outer Chevron Crest -->
    <path d="M 60,10 L 105,45 L 88,58 L 60,35 L 32,58 L 15,45 Z" fill="url(#d3Grad)" filter="url(#d3Glow)"/>
    <path d="M 60,45 L 95,75 L 82,85 L 60,68 L 38,85 L 25,75 Z" fill="#2563EB" opacity="0.8"/>
    <path d="M 60,78 L 78,95 L 60,112 L 42,95 Z" fill="#00E5FF" filter="url(#d3Glow)"/>
    <circle cx="60" cy="95" r="3" fill="#FFFFFF"/>
  </g>
  <text x="200" y="170" font-family="system-ui, sans-serif" font-size="16" font-weight="700" letter-spacing="3" fill="#FFFFFF" text-anchor="middle">DIRECTION 3: GUARDIAN AI</text>
  <text x="200" y="195" font-family="system-ui, sans-serif" font-size="12" fill="#94A3B8" letter-spacing="1" text-anchor="middle">Layered Chevron Sentinel Shield Vectors</text>
</svg>
