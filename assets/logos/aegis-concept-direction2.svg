<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="d2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="d2Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#050B18" rx="16"/>
  <!-- Concentric Orbital Neural Rings -->
  <g transform="translate(140, 20)">
    <circle cx="60" cy="65" r="48" fill="none" stroke="#1E293B" stroke-width="2"/>
    <circle cx="60" cy="65" r="48" fill="none" stroke="url(#d2Grad)" stroke-width="2.5" stroke-dasharray="35, 15, 20, 10" filter="url(#d2Glow)"/>
    <circle cx="60" cy="65" r="32" fill="none" stroke="#2563EB" stroke-width="2" stroke-dasharray="25, 20"/>
    <circle cx="60" cy="65" r="16" fill="#0B1120" stroke="#00E5FF" stroke-width="2" filter="url(#d2Glow)"/>
    <circle cx="60" cy="65" r="7" fill="#FFFFFF"/>
    <!-- Satellite Nodes -->
    <circle cx="60" cy="17" r="3.5" fill="#00E5FF"/>
    <circle cx="108" cy="65" r="3.5" fill="#7C3AED"/>
    <circle cx="26" cy="90" r="3" fill="#2563EB"/>
  </g>
  <text x="200" y="170" font-family="system-ui, sans-serif" font-size="16" font-weight="700" letter-spacing="3" fill="#FFFFFF" text-anchor="middle">DIRECTION 2: AI CORE</text>
  <text x="200" y="195" font-family="system-ui, sans-serif" font-size="12" fill="#94A3B8" letter-spacing="1" text-anchor="middle">Autonomous Central Orbital Intelligence</text>
</svg>
