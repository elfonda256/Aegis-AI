<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Icon Tile (Optional) -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <linearGradient id="metalBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="40%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="coreGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="ambientLight" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="ambientBlur" />
      <feComposite in="SourceGraphic" in2="ambientBlur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Backdrop Aura -->
  <circle cx="100" cy="100" r="70" fill="#00E5FF" opacity="0.12" filter="url(#ambientLight)"/>

  <!-- Outer Protective Shield Perimeter -->
  <path d="M 100,16 
           L 172,46 
           C 172,118 138,168 100,188 
           C 62,168 28,118 28,46 
           Z" 
        fill="#050B18" 
        stroke="url(#shieldGrad)" 
        stroke-width="5" 
        stroke-linejoin="round"
        filter="url(#neonGlow)"/>

  <!-- Inner Geometric Bevel Wall -->
  <path d="M 100,28 
           L 158,52 
           C 158,110 130,152 100,170 
           C 70,152 42,110 42,52 
           Z" 
        fill="#0B1120" 
        stroke="#1E293B" 
        stroke-width="2" 
        opacity="0.85"/>

  <!-- Neural Circuit Traces (Left & Right) -->
  <path d="M 52,65 L 75,78 L 88,78" fill="none" stroke="#00E5FF" stroke-width="1.8" opacity="0.6"/>
  <circle cx="52" cy="65" r="2.5" fill="#00E5FF"/>
  <path d="M 48,102 L 68,102 L 82,112" fill="none" stroke="#2563EB" stroke-width="1.8" opacity="0.6"/>
  <circle cx="48" cy="102" r="2.5" fill="#2563EB"/>

  <path d="M 148,65 L 125,78 L 112,78" fill="none" stroke="#00E5FF" stroke-width="1.8" opacity="0.6"/>
  <circle cx="148" cy="65" r="2.5" fill="#00E5FF"/>
  <path d="M 152,102 L 132,102 L 118,112" fill="none" stroke="#2563EB" stroke-width="1.8" opacity="0.6"/>
  <circle cx="152" cy="102" r="2.5" fill="#2563EB"/>

  <!-- Monolithic Architectural Letter 'A' (Convergence of Shield & Intelligence) -->
  <path d="M 100,42 
           L 138,136 
           L 116,136 
           L 106,112 
           L 94,112 
           L 84,136 
           L 62,136 
           Z 
           M 100,68 
           L 91,95 
           L 109,95 
           Z" 
        fill="url(#coreGlow)" 
        filter="url(#neonGlow)"/>

  <!-- Central Autonomous Neural Core / Quantum Spark -->
  <circle cx="100" cy="85" r="5" fill="#FFFFFF" filter="url(#neonGlow)"/>
  <circle cx="100" cy="85" r="12" fill="none" stroke="#00E5FF" stroke-width="1.5" stroke-dasharray="3, 3" opacity="0.8"/>

  <!-- Apex Energy Beacon -->
  <circle cx="100" cy="42" r="3.5" fill="#00E5FF"/>
</svg>
